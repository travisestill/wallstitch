app-id: io.github.travisestill.WallStitch
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: wallstitch

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Random wallpapers and slideshow imports from wallhaven.cc
  - --share=network
  # Set the wallpaper through Plasma's desktop scripting API
  - --talk-name=org.kde.plasmashell
  # Downloaded wallpapers are saved to ~/Pictures/WallStitch
  - --filesystem=xdg-pictures

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # The PySide6 BaseApp ships build tools and Qt modules WallStitch never uses
  # (WebEngine, PDF, LLVM for the binding generator, numpy, OpenGL wrappers).
  # cleanup: patterns only cover files our own modules install, so delete them.
  - >-
    rm -rf /app/bin/QtWebEngineProcess /app/bin/shiboken6*
    /app/lib/libLLVM* /app/lib/libclang* /app/lib/libexec/webenginedriver
    /app/lib/x86_64-linux-gnu/libQt6WebEngine* /app/lib/x86_64-linux-gnu/libQt6WebView*
    /app/lib/x86_64-linux-gnu/libQt6Pdf*
    /app/lib/python3.*/site-packages/numpy* /app/lib/python3.*/site-packages/OpenGL
    /app/lib/python3.*/site-packages/pyopengl* /app/lib/python3.*/site-packages/shiboken6_generator*
    /app/lib/python3.*/site-packages/patchelf*
    /app/lib/python3.*/site-packages/PySide6/QtWebEngine* /app/lib/python3.*/site-packages/PySide6/QtWebView*
    /app/lib/python3.*/site-packages/PySide6/QtPdf*
    /app/qtwebengine_dictionaries /app/resources /app/translations/qtwebengine_locales

modules:
  # Build-time only: the PEP 517 backend WallStitch's pyproject.toml uses.
  - name: python3-hatchling
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation hatchling
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5f/80/91f51f439c05d4ec4623c22928ce16a938d6d793bf709477830823497859/hatchling-1.32.4-py3-none-any.whl
        sha256: 08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c
      - type: file
        url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
        sha256: a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
      - type: file
        url: https://files.pythonhosted.org/packages/40/9e/2b38731e0fc536806f16490e1a12d7f0dc2a1235aa8cc07bcc75416a7daa/pluggy-1.7.0-py3-none-any.whl
        sha256: 7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec
      - type: file
        url: https://files.pythonhosted.org/packages/30/81/0da8afb52a71d0a4f2bd3152357b1a441e393b286374802b9d3addab4ab5/trove_classifiers-2026.9.21.13-py3-none-any.whl
        sha256: 8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17
      - type: file
        url: https://files.pythonhosted.org/packages/da/46/7d84138a60a8bd796825b2d38ebe92d0d16501ca57d501b7c5d677401bbc/tomlkit-0.15.2-py3-none-any.whl
        sha256: 05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437

  - name: wallstitch
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 src/wallstitch/resources/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps
      # D-Bus activation runs the slideshow agent as its own sandbox instance
      - sed 's|/usr/bin/|/app/bin/|' data/${FLATPAK_ID}.Slideshow.service > ${FLATPAK_ID}.Slideshow.service
      - install -Dm644 ${FLATPAK_ID}.Slideshow.service -t /app/share/dbus-1/services
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - dist
          - .flatpak-builder
          - build-flatpak
