[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallstitch"
description = "Stitch one wallpaper seamlessly across all your monitors"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Travis Estill", email = "immyouany@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]
dynamic = ["version"]
keywords = ["wallpaper", "multi-monitor", "kde", "plasma", "ultrawide", "span"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]

[project.urls]
Homepage = "https://github.com/travisestill/wallstitch"
Issues = "https://github.com/travisestill/wallstitch/issues"

[project.scripts]
wallstitch = "wallstitch.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/wallstitch/__init__.py"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
